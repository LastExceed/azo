[workspace]
resolver = "3"

[workspace.package]
edition = "2024"
keywords = ["ASIO", "audio", "media", "sound", "steinberg"]
categories = ["hardware-support", "multimedia", "multimedia::audio"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/LastExceed/azo"

[package]
name = "azo"
description = "Library for interacting with ASIO drivers"
publish = true
version = "0.3.2"
edition.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[features]
default = ["host"]
host = ["dep:oneshot"]
undocumented = ["azo-sys/undocumented"]

[dependencies]
azo-sys = { path = "./azo-sys", version = "0.3.2" }
oneshot = { version = "0.2.1", features = ["std"], optional = true }
tap = "1.0.1"
windows-core = "0.100.0"
windows-registry = "0.100.0"

[build-dependencies]
windows-bindgen = "0.100.0"
